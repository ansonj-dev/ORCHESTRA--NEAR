[package]
name = "orchestra-near-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.8.1", features = ["derive"] }
near-sdk = { version = "5.17.2", features = ["legacy"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
schemars = "0.8.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5.17.2", features = ["legacy", "unit-testing"] }
