<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4ff1a">
  <title>Orchestra · Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background-color:#fff7ea;background-image:radial-gradient(rgba(13,13,13,.16) 1.2px,transparent 1.2px);background-size:22px 22px;color:#0d0d0d;font-family:'Space Mono',ui-monospace,Menlo,monospace}
    main{width:min(640px,100%);padding:clamp(24px,6vw,56px);border:3px solid #0d0d0d;background:#fffdf6;box-shadow:9px 9px 0 #c9a7ff,12px 12px 0 3px #0d0d0d}
    .tag{display:inline-block;padding:7px 10px;border:3px solid #0d0d0d;background:#f4ff1a;font:700 11px monospace;letter-spacing:.08em;transform:rotate(-2deg)}
    h1{margin:28px 0 12px;font:400 clamp(40px,10vw,84px)/.9 'Archivo Black','Arial Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.03em}
    p{max-width:44ch;line-height:1.6}
    button{margin-top:18px;padding:13px 18px;border:3px solid #0d0d0d;background:#f4ff1a;color:#0d0d0d;box-shadow:5px 5px 0 #0d0d0d;font:700 14px system-ui,sans-serif;text-transform:uppercase;cursor:pointer}
    button:active{transform:translate(4px,4px);box-shadow:none}
  </style>
</head>
<body><main><span class="tag">ORCHESTRA / OFFLINE</span><h1>No signal.<br>Still here.</h1><p>You are offline. Pages you opened before are still on this device. Reconnect to load live agent listings, wallet actions and on-chain data.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
